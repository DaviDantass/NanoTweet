services:
  db:
    image: mysql:8.0
    container_name: nanotweet-db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: NanoTweet
    ports:
      - "3307:3306"
    volumes:
      - nanotweet_data:/var/lib/mysql
    networks:
      - nanotweet-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nanotweet-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://db:3306/NanoTweet
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
    depends_on:
      db:
        condition: service_healthy
    networks:
      - nanotweet-network

volumes:
  nanotweet_data:

networks:
  nanotweet-network:
    driver: bridge
