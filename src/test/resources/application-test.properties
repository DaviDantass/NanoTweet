spring.application.name=NanoTweet

# Configuração H2 para testes
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuração H2 Console (opcional para debug)
spring.h2.console.enabled=false

# JPA/Hibernate para H2 - cria as tabelas automaticamente
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# Desabilitar Flyway para testes (usamos ddl-auto)
spring.flyway.enabled=false
